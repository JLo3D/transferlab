x-transferlab-connection-string: &transferlab-connection-string "Server=sqlserver,1433;Database=TransferLab;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env};Encrypt=True;TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: transferlab-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}"
    ports:
      - "${TRANSFERLAB_SQL_PORT:-1433}:1433"
    volumes:
      - transferlab-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - transferlab

  migrations:
    image: transferlab-migrations:local
    build:
      context: ..
      dockerfile: src/TransferLab.Migrations/Dockerfile
    container_name: transferlab-migrations
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__TransferLab: *transferlab-connection-string
      Migration__MaxAttempts: 12
      Migration__RetryDelay: "00:00:05"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"
    networks:
      - transferlab

  api:
    image: transferlab-api:local
    build:
      context: ..
      dockerfile: src/TransferLab.Api/Dockerfile
    container_name: transferlab-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TransferLab: *transferlab-connection-string
    ports:
      - "${TRANSFERLAB_API_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8080/health/ready || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - transferlab

  worker:
    image: transferlab-worker:local
    build:
      context: ..
      dockerfile: src/TransferLab.Worker/Dockerfile
    container_name: transferlab-worker
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__TransferLab: *transferlab-connection-string
      Worker__PollInterval: "${TRANSFERLAB_WORKER_POLL_INTERVAL:-00:00:02}"
      Worker__BatchSize: "${TRANSFERLAB_WORKER_BATCH_SIZE:-10}"
      Worker__ProcessingTimeout: "${TRANSFERLAB_WORKER_PROCESSING_TIMEOUT:-00:05:00}"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - transferlab

  web:
    image: transferlab-web:local
    build:
      context: ..
      dockerfile: src/TransferLab.Web/Dockerfile
    container_name: transferlab-web
    ports:
      - "${TRANSFERLAB_WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - transferlab

networks:
  transferlab:
    driver: bridge

volumes:
  transferlab-sql-data:
