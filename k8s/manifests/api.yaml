apiVersion: apps/v1
kind: Deployment
metadata:
  name: transferlab-api
  namespace: transferlab
  labels:
    app.kubernetes.io/name: transferlab
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transferlab
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transferlab
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: transferlab-api:peepi
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: transferlab-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: transferlab
  labels:
    app.kubernetes.io/name: transferlab
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: transferlab
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
