apiVersion: apps/v1
kind: Deployment
metadata:
  name: transferlab-web
  namespace: transferlab
  labels:
    app.kubernetes.io/name: transferlab
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: transferlab
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transferlab
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: transferlab-web:peepi
          imagePullPolicy: Never
          env:
            - name: API_UPSTREAM
              value: api.transferlab.svc.cluster.local
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: transferlab
  labels:
    app.kubernetes.io/name: transferlab
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: transferlab
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transferlab
  namespace: transferlab
  labels:
    app.kubernetes.io/name: transferlab
    app.kubernetes.io/component: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
